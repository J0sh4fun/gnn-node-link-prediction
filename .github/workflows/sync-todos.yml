name: Sync project todos

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 2 * * *' # 09:15 Asia/Bangkok
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: project-todo-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: Check synchronization logic
        run: python3 -m unittest discover -s tests -p test_sync_todos.py -v
      - name: Update verified tasks and totals
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m scripts.sync_todos --github --write
      - name: Publish a reviewable update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          files=(docs/plans/member_a_todo.md docs/plans/member_b_week06_todo.md)
          if git diff --quiet -- "${files[@]}"; then
            echo 'Todos already match verified project progress.'
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch=automation/todo-sync
          # This branch is exclusively managed by this workflow.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "$branch:refs/remotes/origin/$branch"
          fi
          git switch -c "$branch"
          git add -- "${files[@]}"
          git commit -m 'docs: sync todos with verified project progress'
          git push --force-with-lease origin "HEAD:refs/heads/$branch"
          pr=$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')
          if [[ -z "$pr" ]]; then
            gh pr create --head "$branch" --base main \
              --title 'docs: synchronize project todo progress' \
              --body 'Automatically updates verified task states, checkboxes and totals from GitHub merge status and recorded acceptance evidence. Unverified tasks retain their manually verified status. Review before merging; this workflow does not approve or merge PRs.'
          fi
