[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cora-node-link-benchmark"
version = "0.1.0"
description = "Phase 1 Cora node classification and link prediction research utilities"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["models*", "layers*", "train*", "utils*", "tasks*", "scripts*"]
